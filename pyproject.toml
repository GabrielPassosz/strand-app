[project]
name = "strand-app"
version = "0.2.0"
description = "Client management for independent hairstylists"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "Pillow==12.3.0",
    "dj-database-url==3.1.2",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.3",
    "tzdata>=2025.2",
    "django-storages[s3]==1.14.6",
    "boto3==1.43.103",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "strand.wsgi:application"

[tool.vercel.scripts]
build = "python -u manage.py check --deploy --fail-level WARNING 2>&1"

