services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: strand
      POSTGRES_USER: strand
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strand -d strand"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN}
      PUBLIC_ORIGIN: https://${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: "True"
      TRUST_CLIENT_IP_HEADER: "True"
      DATABASE_URL: postgresql://strand:${DB_PASSWORD}@db:5432/strand
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL}
    volumes:
      - private_media:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  private_media:
  caddy_data:
  caddy_config:
